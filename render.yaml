# Render Blueprint (optional). Secrets are NOT stored here: sync:false means
# you enter the value in the Render dashboard.
services:
  - type: web
    name: checkmate-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      # Render creates a random secret (base64, 256 bit) on the first deploy: you do not have to make one up.
      # To change it later, edit it in the Render dashboard (everyone then has to sign in again).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
